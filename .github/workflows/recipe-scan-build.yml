name: Recipe scanner branch bundle
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  build-recipe-scanner:
    if: github.event.pull_request.head.repo.full_name == 'chef-chris-griggs/Menu-margin' && github.event.pull_request.head.ref == 'feature/recipe-photo-scanner-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/recipe-photo-scanner-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:scanner
      - name: Check parser and scanner unit tests
        run: npm run test:unit
      - name: Commit only generated scanner browser assets to feature branch
        run: |
          git add vendor/scanner/client.js vendor/scanner/scanner.worker.js vendor/scanner/assets.json
          if git diff --cached --quiet; then
            echo "Scanner bundle already current."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build recipe scanner browser bundle"
            git push origin HEAD:refs/heads/feature/recipe-photo-scanner-foundation
          fi
