name: Recipe scanner branch bundle
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  build-recipe-scanner:
    if: github.event.pull_request.head.repo.full_name == 'chef-chris-griggs/Menu-margin' && github.event.pull_request.head.ref == 'fix/recipe-ocr-quantity-row-grouping'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/recipe-ocr-quantity-row-grouping
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:scanner
      - name: Check parser and scanner unit tests
        run: npm run test:unit
      - name: Commit rebuilt browser scanner to isolated feature branch
        run: |
          git add vendor/scanner/client.js vendor/scanner/scanner.worker.js
          if git diff --cached --quiet; then
            echo "Scanner bundle is already current."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Rebuild recipe scanner browser OCR bundle"
            for attempt in 1 2 3; do
              git fetch origin fix/recipe-ocr-quantity-row-grouping
              git rebase origin/fix/recipe-ocr-quantity-row-grouping
              if git push origin HEAD:refs/heads/fix/recipe-ocr-quantity-row-grouping; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
