name: iOS simulator build
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build MenuMargin for iPhone Simulator
        run: >-
          xcodebuild
          -project ios/MenuMargin.xcodeproj
          -scheme MenuMargin
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/MenuMarginDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Upload simulator app for testing
        uses: actions/upload-artifact@v7
        with:
          name: MenuMargin-iOS-Simulator
          path: ${{ runner.temp }}/MenuMarginDerivedData/Build/Products/Debug-iphonesimulator/MenuMargin.app
          if-no-files-found: error
          retention-days: 14
